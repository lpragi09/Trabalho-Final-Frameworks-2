spring.application.name=eventos-api
server.port=${PORT:8080}

# Banco: H2 em arquivo por padrao (os dados sobrevivem a reinicios).
# Para usar PostgreSQL, defina DB_URL, DB_USER e DB_PASSWORD (ver README).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/eventos;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE:true}

# JWT (em producao defina JWT_SECRET com no minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-32-caracteres-ou-mais}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

# Origens do front-end liberadas no CORS (separadas por virgula)
app.cors.origens=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
